<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — DevBlog</title>
  <meta name="description" content="Sign in to your DevBlog account"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  {% load static %}
  <link rel="stylesheet" href="{% static 'blog/style.css' %}"/>
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">Dev<span>Blog</span></div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to continue reading and writing</p>

      <div id="login-error" class="form-error" style="display:none;"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="your_username" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" required/>
            <button type="button" class="toggle-pw" id="toggle-pw">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup/">Sign Up</a></p>
      </div>

      <div class="jwt-info">
        <span class="jwt-badge">🔐 JWT</span>
        <p>Your credentials are verified and you receive a secure <strong>access token</strong> + <strong>refresh token</strong> stored locally.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = '';
  </script>
  {% load static %}
  <script src="{% static 'blog/index.js' %}"></script>

</body>
</html>
